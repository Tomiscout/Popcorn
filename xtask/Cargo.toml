[package]
name = "xtask"
description = "Popcorn's build: builds, bundles and releases the apps of the host platform (`cargo xtask --help`)"
# Not a product: set_version.mjs leaves it alone
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
