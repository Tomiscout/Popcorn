# One Cargo workspace for every Rust crate: one Cargo.lock, one target/ (CEF's build is shared by Popcorn.Linux
# and Popcorn.Player.Native). Every member builds on every OS: the platform crates' dependencies are
# `[target.'cfg(...)'.dependencies]` and their code is empty elsewhere, so `cargo build --workspace` / `cargo clippy
# --workspace` work on Linux and Windows. Products are built by `cargo xtask` (xtask/, alias in .cargo/config.toml).
[workspace]
resolver = "3"
members = [
    "Popcorn.Cli",
    "Popcorn.Installer",
    "Popcorn.Linux",
    "Popcorn.Player.Native",
    "Popcorn.Player.Windows.Native",
    "xtask",
]

# set_version.mjs writes this version
[workspace.package]
version = "1.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Keep exact: the CEF binary distribution (libcef.so + resources) is tied to this version, and Popcorn.Linux and
# Popcorn.Player.Native share the one bundled next to them (`cargo xtask bundle` finds its runtime files through
# cargo metadata).
cef = { version = "=156.3.0", default-features = false }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Popcorn.Installer: `cargo build --profile installer -p popcorn-installer` -> target/installer/. Its own profile
# because opt-level has to cover its dependencies too (eframe/wgpu are most of the binary), and it keeps unwinding.
[profile.installer]
inherits = "release"
opt-level = "s"
panic = "unwind"
