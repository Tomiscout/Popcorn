[package]
name = "popcorn-player-windows-native"
description = "Native layer of the Windows player: Win32 window, mpv video and WebView2 overlay, loaded by Popcorn.Player.Windows (C#)"
version = "1.1.0"
edition = "2024"
publish = false

[lib]
# popcorn_player.dll, P/Invoked from Popcorn.Player.Windows (see src/lib.rs for the C ABI).
name = "popcorn_player"
crate-type = ["cdylib"]

[dependencies]
webview2-com = "0.39"
# Same major version as webview2-com's.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
