[package]
name = "popcorn-player-windows-native"
description = "Native layer of the Windows player: Win32 window, mpv video and WebView2 overlay, loaded by Popcorn.Player.Windows (C#)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# popcorn_player_windows.dll, bundled as popcorn_player.dll (Popcorn.Player.Windows.csproj) and P/Invoked from
# Popcorn.Player.Windows (see src/lib.rs for the C ABI). Its own name in target/: the Linux crate's library is
# popcorn_player, and every member builds on every OS.
name = "popcorn_player_windows"
crate-type = ["cdylib"]

# Windows only; elsewhere the crate is an empty stub (src/lib.rs).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
# Same major version as webview2-com's.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
