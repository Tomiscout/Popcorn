<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Netflix Video</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css?family=Rubik&display=swap" rel="stylesheet">
</head>

<body>
  <div class="video-container">
    <!-- <video src="bbb.mp4"></video> -->
    <!-- <video src="http://distribution.bbb3d.renderfarming.net/video/mp4/bbb_sunflower_1080p_30fps_normal.mp4"></video> -->
    <div class="controls-container">
      <div class="progress-controls">
        <div class="progress-bar">
          <div class="watched-bar"></div>
          <div class="playhead"></div>
        </div>
        <div id="time-remaining">
          00:00
        </div>
      </div>
      <div class="controls">
        <button class="play-pause">
          <img class="playing" src="assets/icons/play.svg"/>
          <img class="paused" src="assets/icons/stop.svg"/>
        </button>
        <button class="rewind">
          <img src="assets/icons/10-back.svg"/>
        </button>
        <button class="fast-forward">
          <img src="assets/icons/10-forward.svg"/>
        </button>

        <div id="volume">
          <div id="volume-popup">
            <div id="volume-control"></div>
          </div>
          <button id="volume-button">
            <img class="low-volume" src="assets/icons/sound-min.svg"/>
            <img class="mid-volume" src="assets/icons/sound-mid.svg"/>
            <img class="full-volume" src="assets/icons/sound-max.svg"/>
            <img class="muted" src="assets/icons/sound-mute.svg"/>
          </button>
        </div>
        
        <p>
          <div id="plainTitle" class="title" style="display: none;">
            <span id="plainTitleSpan" class="series"></span>
          </div>
          <div id="seriesTitle" class="title" style="display: none;">
            <span class="series">Blender Foundation</span> <span class="episode">Big Buck Bunny</span>
          </div>
        </p>
        
        <button class="next">
          <img src="assets/icons/next.svg"/>
        </button>
        <button class="episodes">
          <img class="white" src="assets/icons/episodes.svg"/>
        </button>
        <button class="subtitles">
          <img src="assets/icons/subtitles.svg"/>
        </button>
        <button class="full-screen">
          <img class="maximize" src="assets/icons/fullscreen.svg"/>
          <img class="minimize" src="assets/icons/minimize.svg"/>
        </button>
      </div>
    </div>
  </div>
  <script src="lib/jquery-3.6.3.min.js"></script>
  <script src="lib/jquery-ui-slider.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
